# GoldSweep configuration: strategy, session and risk parameters.
#
# * Secrets (API keys, MT5 login) never go here. They live in .env.
# * Unknown or duplicated keys stop the program at startup, so a typo cannot
#   silently fall back to a default.
# * Always quote clock times ("15:00"). Unquoted, YAML reads 15:00 as the
#   number 900, and the program refuses to start.

symbol_candidates: [XAUUSD, XAUUSD.m, XAUUSDm, GOLD]

# PAPER never sends orders. LIVE needs "mode: LIVE" here AND "MODE=LIVE" in
# .env AND a typed confirmation at startup. Any disagreement means PAPER.
mode: LIVE

timeframes: {bias: H1, liquidity: M15, trigger: M5}

sessions:
  # Every window is written in its own local time zone and converted to UTC
  # for each day, so daylight-saving changes need no edits here.
  # Asia's setups are looked for (D87); what trades there is up to its playbook below.
  asia:    {tz: Asia/Tokyo,       start: "09:00", end: "15:00", trade: true}
  london:  {tz: Europe/London,    start: "07:00", end: "10:00", trade: true}
  newyork: {tz: America/New_York, start: "08:00", end: "11:00", trade: true}
  # London-NY overlap = the hours when both full sessions below are open.
  overlap:
    trade: true
    london:  {tz: Europe/London,    start: "08:00", end: "16:30"}
    newyork: {tz: America/New_York, start: "08:00", end: "17:00"}
  # No new trades: daily rollover, wide spreads.
  rollover_block: {tz: America/New_York, start: "16:45", end: "18:15"}
  # No new trades on Friday from this time on.
  friday_cutoff: {tz: America/New_York, time: "12:00"}
  # Weekly close (Friday) and reopen (Sunday) of the gold market.
  weekend: {tz: America/New_York, close: "17:00", open: "18:00"}
  # false: new trades only inside the windows marked trade: true (the spec).
  # true: at any hour the market is open (rollover, Friday cutoff, weekend and
  # news blackouts still apply; setups outside the kill zones score lower).
  trade_all_hours: false

strategy:
  atr_period: 14
  atr_method: sma              # sma = the ATR MetaTrader 5 draws | wilder
  swing_lookback: 3
  eq_tolerance_atr: 0.15
  min_sweep_atr: 0.10
  max_bars_back_inside: 3
  mss_window: 12
  mss_structure_lookback: 30   # how far back the last lower high / higher low may lie (M5 bars)
  displacement_atr: 1.2        # a body of at least 1.2 x ATR counts as displacement, or ...
  displacement_body_ratio: 0.70      # ... a body of at least 70% of the candle's range
  displacement_min_range_atr: 1.0    #     on a candle at least 1 ATR tall
  fvg_min_atr: 0.05            # ignore fair value gaps smaller than this share of ATR
  entry_mode: fvg_mid          # fvg_mid | fvg_near | fvg_far | ote | fvg_top | fvg_bottom | market
  entry_zone_priority: [fvg, ifvg, order_block]
  fib_low: 0.62
  fib_high: 0.79
  sl_buffer_atr: 0.10
  min_rr: 2.0
  entry_expiry_bars: 24        # spec default 6; 24 (2 hours) chosen on the 2024-2026 backtest (D82)
  alert_threshold: 60
  auto_trade_threshold: 60     # spec default 75; 60 on the demo account to collect evidence (D81)
  liquidity:
    swing_points: true         # unswept M15 swing highs/lows are liquidity pools
    major_swing_lookback: 10   # bars each side that make a swing point a major (external) one
    trendlines: true           # three or more swing points on one line
    trendline_min_touches: 3
    round_number_step: 10.0
    round_number_major_step: 50.0
    min_sweep_pool_strength: 0.5   # weaker pools are tracked but do not start a setup
    max_pool_age_hours: 48
    day_boundary: {tz: America/New_York, time: "17:00"}   # where a trading day ends
  bias:
    structure_weight: 0.5      # H1 swing structure
    location_weight: 0.2       # premium / discount against the previous day's midpoint
    news_weight: 0.3           # news bias (arrives in Phase 4; counts as 0 until then)
    threshold: 0.25            # score needed for LONG / SHORT; below it the bias is NEUTRAL
    neutral_extra_score: 5     # extra points a signal needs while the bias is NEUTRAL
  crt:                         # Candle Range Theory
    enabled: true
    timeframe: H4              # H1 or H4, anchored to the 17:00 New York close
    max_age_candles: 2
  refinement:                  # M1 "sniper" entries (D83): wait for an M1 turn inside the gap
    mode: none                 # none (trade the M5 setup as it is) | m1
    confirm: choch             # choch (close through the last M1 lower high) | cisd
    entry: market              # market (at the turn) | fvg_mid (limit in the M1 gap)
    swing_lookback: 2          # M1 bars each side of a swing point
    sl_buffer_atr: 0.2         # stop beyond the pullback's extreme, in M1 ATRs (+ spread)
    min_stop_spreads: 4        # the stop is never closer than 4 spreads ...
    min_stop_atr: 1.0          # ... nor than 1 M1 ATR
    entry_wait_bars: 10        # how long a fvg_mid limit waits, in M1 bars
  scoring:                     # points per component; must add up to 100
    sweep_quality: 20
    displacement: 15
    entry_zone: 10
    fib: 5
    htf_bias: 15
    news_bias: 10
    kill_zone: 10
    spread: 5
    premium_discount: 5
    crt: 5

news:
  # No new entries from 30 min before to 15 min after a high-impact release:
  # every high-impact event in these currencies, plus any event whose title
  # contains one of the keywords.
  blackout_before_min: 30
  blackout_after_min: 15
  blackout_currencies: [USD]
  # (FOMC member speeches are not on the list: only the decision, minutes and
  # press conference, and the Fed Chair.)
  blackout_keywords: [CPI, Non-Farm, NFP, FOMC Statement, FOMC Meeting Minutes,
                      FOMC Press Conference, FOMC Economic Projections, Federal Funds Rate,
                      Fed Chair, PCE, GDP, ISM, Retail Sales, Unemployment Claims,
                      Jobless Claims]
  # After a high-impact release, allow setups from 15 to 90 min later even
  # outside the kill zones (the first spike often sweeps a nearby pool).
  post_news_sweep_mode: true
  post_news_start_min: 15
  post_news_end_min: 90
  # As a blackout starts, a trade at least this many R up moves its stop to
  # breakeven (spec 5.6). 0 turns it off.
  breakeven_before_news_r: 1.0
  headline_half_life_min: 120   # a headline's weight halves every 2 hours
  # AI headline classifier. The provider, key and model are set in .env
  # (LLM_PROVIDER, its key, LLM_MODEL). Without a key, with llm_enabled false,
  # or once a limit below is reached, keyword rules classify instead.
  llm_enabled: true
  llm_daily_budget_usd: 0.50
  # Leave these empty to use the provider's defaults: Claude Haiku 5.5 costs
  # 0.10 / 0.50 US$ per million tokens with no call cap; Groq's free plan costs
  # nothing and is capped at 6 calls a minute and 180 a day.
  llm_input_usd_per_mtok:
  llm_output_usd_per_mtok:
  llm_max_calls_per_minute:
  llm_max_calls_per_day:
  llm_prefilter: true   # headlines with no gold-related words skip the model
  # Calendar sources, tried in this order. FinanceCalendar.com needs
  # FINANCECALENDAR_API_KEY in .env; its free plan allows 10 requests a day.
  # On a paid plan, set refresh_min: 15 and fast_refresh_min: 1 (spec 5.6).
  # The Forex Factory feed needs no key but has no actual figures.
  calendar_sources:
    - {name: financecalendar, refresh_min: 180, daily_request_limit: 10}
    - {name: forexfactory, refresh_min: 60}   # it answers 429 to frequent polling
  fast_window_min: 10
  # Headlines: Finnhub (FINNHUB_API_KEY in .env) and these RSS feeds.
  finnhub_categories: [forex, general]
  rss_feeds:
    - {name: Federal Reserve, url: "https://www.federalreserve.gov/feeds/press_all.xml"}
    - {name: ECB, url: "https://www.ecb.europa.eu/rss/press.html"}
    - {name: FXStreet, url: "https://www.fxstreet.com/rss/news"}
  headline_poll_min: 5
  headline_max_age_hours: 12
  # Pre-session scenario briefs.
  scenario_before_session_min: 30
  scenario_before_event_min: 60

risk:
  risk_per_trade_pct: 0.5      # hard maximum 2.0
  max_open_positions: 1
  max_trades_per_day: 3
  daily_loss_limit_pct: 2.0
  weekly_loss_limit_pct: 5.0
  max_consecutive_losses: 3
  breakeven_at_r: 0              # spec 1.0; 0 = only when TP1 is reached (owner, D84)
  # Spec 7b: each trade is split into up to three positions with the same entry
  # and stop: 50% to TP1 (nearest pool), 30% to TP2 (next pool), the rest to TP3.
  partial_close_at_tp1_pct: 50
  partial_close_at_tp2_pct: 30
  tp3_r: 3.0     # TP3 this many R from the entry; 0 = no TP3 (its share goes to TP2)
  # pools: targets at the liquidity pools (above). fixed_r: at fixed_targets_r R from
  # the entry instead; one value closes everything there, more values split (D84).
  target_mode: pools
  fixed_targets_r: [3.0]
  max_trades_per_session: 2
  # Spread filter: no new trade while the spread is above 2x its 20-day median.
  max_spread_multiple: 2.0
  spread_median_days: 20

# Buyer/seller pressure meter. An ESTIMATE: spot gold has no central exchange,
# so MT5 "tick volume" counts price changes, not contracts bought or sold.
# Shown with alerts and on the dashboard; it does not change signal scores.
pressure:
  timeframe: M15
  window: 24              # bars (24 x M15 = the last 6 hours)
  balanced_band: 0.10     # |score| below this reads "balanced"
  strong_level: 0.40      # |score| from this reads "strong buyers / sellers"
  weights:                # must add up to 1.0
    volume: 0.40          # where bars close in their range, weighted by tick volume
    candles: 0.25         # size of up-candle bodies against down-candle bodies
    structure: 0.15       # H1 swing structure (up / down / range)
    news: 0.20            # news bias (headlines and upcoming events, Phase 4)

backtest:
  initial_balance: 10000
  warmup_days: 10
  trade_threshold: auto_trade   # auto_trade | alert
  trail_after_tp1: true
  use_m1_for_fills: true        # when one-minute history is stored
  costs:
    spread_source: bar          # bar | fixed
    fixed_spread_points: 25
    extra_spread_points: 0
    slippage_points: 10         # market entries and stop-loss exits
    # Round trip, account currency. 0: the Exness standard account (XAUUSDm) charges
    # none, its cost is the spread (122 demo deals, D107/D108). Raw-spread or ECN
    # accounts charge one: set it from your broker's deals.
    commission_per_lot: 0.0
  walk_forward:
    train_months: 6
    test_months: 2
    min_train_trades: 20
    grid:
      auto_trade_threshold: [65, 75, 85]
      min_rr: [2.0, 2.5, 3.0]
      entry_expiry_bars: [6, 12, 24]   # how long an entry waits (D82)

# The live loop. PAPER (the default mode) simulates every order: nothing is sent.
execution:
  auto_trade: true        # trade signals that clear auto_trade_threshold
  bar_delay_seconds: 2    # read each M5 bar this long after it closes
  bar_wait_seconds: 30    # keep asking this long if the broker is late with it
  # LIVE only (python main.py --live, needs MODE=LIVE in .env AND mode: LIVE here):
  magic_number: 7341926   # marks the bot's own orders and positions in MT5
  deviation_points: 30    # largest accepted price difference on a market order
  max_total_lots: 1.0     # never more lots than this open at once
  min_margin_level_pct: 1000   # refuse orders that would take margin level below this
  allow_real_account: false    # Phase 6 trades DEMO accounts only
  sync_seconds: 5         # compare orders and positions with MT5 this often
  # The on-chart panel: signals.json in MT5's Common\Files\GoldSweep folder,
  # drawn by mt5/GoldSweepPanel.mq5 (see README).
  panel_enabled: true
  panel_signals: 10

# Telegram alerts: set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in .env.
alerts:
  telegram_enabled: true
  send_blocked: true          # also report setups the risk rules blocked, with why
  send_scenarios: true
  pre_news_warning_min: 15
  daily_summary_time: "21:00"
  daily_summary_tz: America/New_York
  heartbeat_minutes: 60     # a quiet "still running" message this often (0 = never)
  watchdog_minutes: 15      # --watchdog alerts when the bot is silent this long

# Daily upkeep: a copy of the database in data/backups, and old log rows removed.
housekeeping:
  backup_time_utc: "00:15"
  backups_kept: 14
  log_days: 30

broker:
  # MetaTrader 5 reports bar and tick times in the broker's SERVER clock, not
  # in UTC. GoldSweep converts them to true UTC with this rule:
  #   auto            measure it from a live tick (recommended)
  #   "NY+7"          New York time + 7h: most FX/CFD brokers (UTC+2 winter, UTC+3 summer)
  #   "Europe/Athens" server follows EU daylight-saving dates
  #   "UTC"           server runs on UTC
  #   "+02:00"        fixed offset, no daylight saving
  server_timezone: auto

# Setup models (Phase 9, D85). Each looks for setups on its own; their trades share
# the risk limits above. trade: false sends a model's setups as alerts only, and
# leaves them out of backtests. A new model trades only after its own backtest
# supports it and the owner approves.
models:
  sweep_mss:      {enabled: true, trade: true}    # the spec's model
  cisd:           {enabled: true, trade: false}   # confirmed by a CISD instead of the MSS
  continuation:   {enabled: true, trade: false}   # internal pools, with the H1 trend
  breakout:       {enabled: true, trade: false}   # session-range / previous-day breaks that hold (D86)
  # (The Silver Bullet model was replaced by session playbooks, D86; the Silver
  # Bullet hours remain a confluence tag.)

# Session playbooks (Phase 10, D86, D87). Per session: what auto-trades there now
# (trading) and the A+ playbook the analysis found (candidate). A candidate is
# graded A+ in alerts and paper-traded on a shadow book (never sent to MT5); after
# monitor_trades finished trades with a positive average the bot asks for
# /approve <session>. An approved candidate replaces the trading rule (only A+
# setups trade there); /revoke <session> undoes it. Editing a candidate here
# withdraws its approval and starts its count again.
# python -m goldsweep.playbook --from 2024-01-01 --to 2026-10-31 suggests them.
playbooks:
  asia:                        # the Asian (Tokyo) session
    trading: null
    candidate: null
  london:
    trading: {model: sweep_mss, min_score: 60, tags_any: [], min_tags: 0}
    candidate: {model: sweep_mss, min_score: 60, tags_any: [judas], min_tags: 0}   # D86
  newyork:                     # including the London-NY overlap and post-news setups
    trading: {model: sweep_mss, min_score: 60, tags_any: [], min_tags: 0}
    candidate: {model: sweep_mss, min_score: 60, tags_any: [judas], min_tags: 0}   # D86
  monitor_trades: 20

# Extra evidence recorded on every signal as tags (it does not change the score).
confluence:
  smt:                         # gold-silver divergence at the sweep
    enabled: true
    symbol_candidates: [XAGUSD, XAGUSD.m, XAGUSDm, SILVER]
    lookback_bars: 24

# Which strategies may open trades, and the scalper's mode (D103, D111). These are the
# startup defaults; /mode and /scalper on Telegram (or the dashboard) change them
# while the bot runs. A selected mode runs on paper; /approve scalper <mode> sends its
# orders to the demo account; unbuilt modes do nothing.
switch:
  strategies: main               # main | scalper | both
  scalper_mode: "off"            # "off" | hft | intraday | swing (quote "off")

# The tick recorder (D106): every gold tick from the broker, saved in data/ticks/
# (about 0.3 MB a busy hour). Off: the owner set it aside (D111); true turns it back on.
ticks:
  record: false
  keep_days: 0                   # 0 keeps every day

# The scalper add-on's settings (docs/SCALPER_SPEC.md, docs/SCALPER_MODES.md, D88-D111).
# It runs alongside the main strategy, never instead of it. The HFT mode (S5, D111)
# trades S1's two rules on M1 bars in the active sessions: on paper, then on the demo
# account after /approve scalper hft. Its backtest (the "hft" line) is reported, not a gate:
# python -m goldsweep.scalping.backtest --from 2024-01-01 --to 2026-10-31
scalper:
  timeframe: M1
  strategy: sweep_reclaim        # sweep_reclaim | trail_rejection (HFT runs both, D111)
  sessions: [london, newyork, overlap]   # the active sessions the HFT mode trades
  magic_number: 7341927          # HFT's number at the broker; intraday +1, swing +2 (D112)
  paper_balance: 10000           # the scalper's paper book (notional)
  activity_min: 1.0              # HFT: M1 ATR at least its median of the last...
  activity_bars: 1440            # ...1440 M1 bars (a day)
  htf_filter: true               # S1 backtest variants only; the HFT mode drops it (D111)
  atr_period: 14
  step_trail: {atr_period: 10, multiplier: 2.0}
  swing_bars: 2                  # bars each side that confirm a micro swing
  micro_lookback: 15
  sweep_min_atr: 0.05
  sweep_window: 6
  twin_bars_tolerance_atr: 0.05
  sl_buffer_atr: 0.10
  sl_min_atr: 0.5
  sl_max_atr: 3.0
  tp_step_r: 0.5                 # TP1/TP2/TP3 at 0.5/1.0/1.5 R; 2.0 = the "wide" ladder
  tp_step_r_max: 2.0
  split: [0.4, 0.3, 0.3]         # the three children's shares (TP1, TP2, TP3)
  adaptive_trail: true           # breakeven+ after TP1, stop to TP1 after TP2, step trail
  risk:
    risk_per_scalp_pct: 0.25     # all three children together
    max_scalps_per_day: 8
    daily_loss_limit_pct: 1.0
    max_consecutive_losses: 3    # then paused for 24 hours
    cooldown_sec: 300            # no same-direction scalp this long after a stop-out
    time_stop_sec: 900           # not at TP1 and below +0.3 R after 15 minutes: closed
    time_stop_min_r: 0.3
    max_spread_multiple: 1.5
    cost_multiple: 2.0           # TP1 at least 2x the round-trip cost away
    max_open_risk_pct: 0.75      # both strategies' open risk together (account guard)
  # The intraday mode (S6, D112): M5 signals, entries and management on M1 bars, flat by
  # the New York rollover. mode_rules/mode_ladder are what it trades; rules/ladders are
  # S3's backtest of the textbook rules (D109: all lost after costs).
  # python -m goldsweep.scalping.mode_backtest --mode intraday --from 2024-01-01 --to 2026-10-31
  # python -m goldsweep.scalping.intraday_backtest --from 2024-01-01 --to 2026-10-31   (S3)
  intraday:
    mode_rules: [sweep_reclaim, opening_range, vwap_trend]
    mode_ladder: [1.0, 2.0, 3.0]
    h1_filter: true              # no entry against the H1 trend
    rules: [asian_breakout, opening_range, vwap_trend]
    breakout_buffer_atr: 0.1     # a breakout close clears the range by this much
    sl_buffer_atr: 0.1
    sl_min_atr: 0.5
    sl_max_atr: 4.0
    ladders: [[1.0, 2.0, 3.0], [0.5, 1.0, 1.5]]   # R steps tried; chosen on the first 2/3
    ny_open: "09:30"             # America/New_York: the opening range starts here
    opening_range_minutes: 15
    breakout_until: "12:00"      # America/New_York: last opening-range breakout
    vwap_slope_bars: 6
    swing_bars: 6                # VWAP-trend stop beyond these bars' extreme
    min_trades: 100              # the evidence gate (D103)
  # The swing mode (S4, D110): daily trend rules held for days, swap paid each night.
  # They failed their evidence test (negative over 2014-2022), and a 0.01 lot needs a
  # balance of about 76,000 at 0.25% a trade, so the mode does not run.
  # python -m goldsweep.scalping.swing_backtest --from 2014-01-01 --to 2026-10-31
  #   [--offline] [--balance 1000000 to measure R without the minimum lot deciding]
  swing:
    rules: [donchian_breakout, momentum, pullback]
    breakout_days: 55            # a close beyond the last 55 days' extreme
    exit_days: 20                # the stop then trails the last 20 days' low (high)
    momentum_months: 12          # the sign of the 12-month return, re-decided monthly
    trend_days: 200              # pullback: with the 200-day average's trend...
    pullback_days: 20            # ...a close back across the 20-day average
    atr_days: 20
    stop_atr: 2.0                # the first stop, in daily ATRs
    ladders: [[2.0, 4.0, 6.0], [3.0, 6.0, 10.0]]   # R steps tried; chosen on the first 2/3
    min_trades: 30               # the evidence gate (D103)
  # The swing-scalping mode, /scalper swing (S6, D112): M15 entries with the H1 trend,
  # managed on M1 bars, held hours to two days, flat before the weekend, swap charged.
  # python -m goldsweep.scalping.mode_backtest --mode swing --from 2024-01-01 --to 2026-10-31
  swing_scalp:
    rules: [ema_pullback, range_breakout]   # only with the H1 trend (h1_trend below)
    ema_bars: 20                 # pullback: a touch of the M15 20 EMA...
    pullback_bars: 3             # ...within 3 bars, then a close back with the trend
    breakout_buffer_atr: 0.1     # breakout: an M15 close beyond the Asian/London range
    channel_bars: 20             # the stop trails the last 20 M15 bars' low (high)
    sl_buffer_atr: 0.1
    sl_min_atr: 0.5
    sl_max_atr: 3.0
    ladder: [1.0, 2.0, 3.0]
    max_hold_hours: 48
    weekend_buffer_min: 60       # flat this long before the Friday close
  # The H1 trend of the intraday and swing modes (D112), built from the M1 feed.
  h1_trend:
    ema_hours: 50                # the last H1 close beyond a 50-hour EMA...
    slope_hours: 5               # ...that has moved that way over 5 hours

display_timezone: Africa/Kampala
